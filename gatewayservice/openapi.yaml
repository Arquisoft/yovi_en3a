openapi: 3.0.0
info:
  title: YOVI API
  version: 1.0.0
  description: API gateway that routes requests to the corresponding microservices

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Users
    description: User management and authentication
  - name: Game Manager
    description: Game session management
  - name: Gamey
    description: External bot API

paths:
  /status:
    get:
      tags:
        - Users
      summary: Gateway health check
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: gatewayservice

  /api/users/register:
    post:
      tags:
        - Users
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username:
                  type: string
                  example: user1
                email:
                  type: string
                  example: user1@test.com
                password:
                  type: string
                  example: User1234
                age:
                  type: integer
                  example: 25
                country:
                  type: string
                  example: Spain
      responses:
        '201':
          description: User created
        '400':
          description: Validation error
        '409':
          description: Username or email already in use

  /api/users/login:
    post:
      tags:
        - Users
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: user1
                password:
                  type: string
                  example: User1234
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  userId:
                    type: string
        '400':
          description: Validation error
        '401':
          description: Wrong credentials

  /api/users/stats/ranking:
    get:
      tags:
        - Users
      summary: Get global ranking
      security:
        - bearerAuth: []
      parameters:
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [wins, winRate]
            default: wins
      responses:
        '200':
          description: Ranking
          content:
            application/json:
              schema:
                type: object
                properties:
                  topPlayers:
                    type: array
                    items:
                      type: object
                  userPosition:
                    type: object
                    nullable: true
        '400':
          description: Invalid sort method
        '401':
          description: Unauthorized

  /api/users/stats/{userId}:
    get:
      tags:
        - Users
      summary: Get personal stats
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  gamesPlayed:
                    type: integer
                  wins:
                    type: integer
                  losses:
                    type: integer
                  winRate:
                    type: number
        '400':
          description: Invalid userId
        '401':
          description: Unauthorized
        '404':
          description: Stats not found

  /api/users/history/{userId}:
    get:
      tags:
        - Users
      summary: Get match history of a user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Match history ordered by most recent
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        result:
                          type: string
                          enum: [won, lost, resigned]
                        botId:
                          type: string
                        boardSize:
                          type: integer
                        gameType:
                          type: string
                        playedAt:
                          type: string
                          format: date-time
        '400':
          description: Invalid userId
        '401':
          description: Unauthorized
        '404':
          description: User not found

  /api/game-manager/create/{gameName}:
    post:
      tags:
        - Game Manager
      summary: Create a new game
      security:
        - bearerAuth: []
      parameters:
        - name: gameName
          in: path
          required: true
          schema:
            type: string
            enum: [standard, master, fortune, pie, tabu, holey, whynot]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                botId:
                  type: string
                  enum: [random_bot, beginner_bot, medium_bot]
                  default: random_bot
                boardSize:
                  type: integer
                  default: 5
      responses:
        '201':
          description: Game created
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameId:
                    type: string
                  yen:
                    type: object
                  status:
                    type: string
        '400':
          description: Invalid game type or missing userId
        '401':
          description: Unauthorized

  /api/game-manager/state/{id}:
    get:
      tags:
        - Game Manager
      summary: Get game state
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Game state
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameId:
                    type: string
                  yen:
                    type: object
                  status:
                    type: string
                    enum: [ongoing, won, lost, resigned]
                  botId:
                    type: string
                  boardSize:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Game not found

  /api/game-manager/list:
    get:
      tags:
        - Game Manager
      summary: List all games of the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of games
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  games:
                    type: array
                    items:
                      type: object
        '401':
          description: Unauthorized

  /api/game-manager/game/{id}/move/player:
    post:
      tags:
        - Game Manager
      summary: Apply player move
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [coords]
              properties:
                coords:
                  type: object
                  required: [x, y]
                  properties:
                    x:
                      type: integer
                    y:
                      type: integer
      responses:
        '200':
          description: Move applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameId:
                    type: string
                  yen:
                    type: object
                  status:
                    type: string
        '400':
          description: Invalid move or game already finished
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Game not found

  /api/game-manager/game/{id}/move/bot:
    post:
      tags:
        - Game Manager
      summary: Request bot move
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bot moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  gameId:
                    type: string
                  yen:
                    type: object
                  status:
                    type: string
        '400':
          description: Game already finished
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Game not found
        '503':
          description: Bot unavailable

  /api/game-manager/game/{id}/resign:
    post:
      tags:
        - Game Manager
      summary: Resign a game
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Game resigned
        '400':
          description: Game already finished
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Game not found

  /play:
    get:
      tags:
        - Gamey
      summary: Get bot move for external bots (no authentication required)
      parameters:
        - name: position
          in: query
          required: true
          description: Board state in YEN notation (JSON string)
          schema:
            type: string
            example: '{"size":4,"turn":1,"players":["B","R"],"layout":"B/.B/RB./B..R"}'
        - name: bot_id
          in: query
          required: false
          schema:
            type: string
            enum: [random_bot, beginner_bot, medium_bot]
            default: medium_bot
      responses:
        '200':
          description: Bot move coordinates
          content:
            application/json:
              schema:
                type: object
                properties:
                  coords:
                    type: object
                    properties:
                      x:
                        type: integer
                      y:
                        type: integer
                      z:
                        type: integer
        '400':
          description: Missing or invalid position parameter
        '500':
          description: Gamey service error